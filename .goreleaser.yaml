version: 2
project_name: kube-upgrade-preflight

builds:
  - main: ./cmd/kube-upgrade-preflight
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - deploy/rbac.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: 新機能
      regexp: '^feat'
      order: 0
    - title: 修正
      regexp: '^fix'
      order: 1
  filters:
    exclude:
      - '^test'
      - '^docs'
      - '^ci'
      - '^chore'
      - '^build'
