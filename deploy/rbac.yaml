# Permissions needed by kube-upgrade-preflight. Everything is read-only except
# the optional pods/eviction rule used by --server-dry-run, which only ever
# sends dryRun=All requests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-upgrade-preflight
  namespace: kube-upgrade-preflight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-upgrade-preflight
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]
  # helm-releases: Helm 3 stores releases in Secrets labelled owner=helm.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list"]
  # deprecated-apis reads apiserver_requested_deprecated_apis.
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  # Only needed with --server-dry-run.
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-upgrade-preflight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-upgrade-preflight
subjects:
  - kind: ServiceAccount
    name: kube-upgrade-preflight
    namespace: kube-upgrade-preflight
